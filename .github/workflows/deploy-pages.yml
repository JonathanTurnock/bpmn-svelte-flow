name: Deploy to GitHub Pages

# Publishes the committed studio build in site/ (refresh it with
# `bun run build-site`) to GitHub Pages on every push to the default branch.
on:
  push:
    branches: [claude/svelte-flow-bpmn-renderer-obs7vm, main, master]
    paths: ['site/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
