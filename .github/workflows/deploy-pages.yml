name: Deploy to GitHub Pages

# Publishes the committed studio build in site/ (refresh it with
# `bun run build-site`) by pushing it to the gh-pages branch, which GitHub
# Pages serves. This route needs no repo-settings API access: GitHub
# auto-configures Pages from a gh-pages branch when it appears.
on:
  push:
    branches: [claude/svelte-flow-bpmn-renderer-obs7vm, main, master]
    paths: ['site/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
